[package]
name = "wavekeep"
version = "0.3.0"
description = "Wavekeep, a desktop music downloader for Deezer and Spotify"
authors = ["you"]
edition = "2021"

[lib]
name = "wavekeep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# librespot-core's build script pulls vergen-gitcl 1.0.8, which resolves
# vergen 9.1.0 alongside vergen-lib 0.1.6 and fails to compile. Pin vergen to
# the last release that depends only on vergen-lib 0.1.x.
vergen = "=9.0.6"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream", "cookies"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
md5 = "0.7"
aes = "0.8"
blowfish = "0.9"
cbc = "0.1"
cipher = { version = "0.4", features = ["block-padding"] }
id3 = "1"
metaflac = "0.2"
image = "0.25"
keyring = { version = "3", features = ["sync-secret-service", "windows-native", "apple-native"] }
regex = "1"
lazy_static = "1.4"
url = "2"
base64 = "0.22"
librespot-core = "0.8"
librespot-metadata = "0.8"
librespot-audio = "0.8"
librespot-oauth = "0.8"
lofty = "0.25"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
